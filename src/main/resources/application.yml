spring:
  application:
    name: aola-star-lab
  config:
    import: optional:file:./config/mysql-local.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: '${DB_URL:jdbc:mysql://106.54.208.184:3306/aola_lab?useUnicode=true&characterEncoding=utf8mb4&allowMultiQueries=true&characterEncoding=utf8&autoReconnect=true&allowPublicKeyRetrieval=true&useSSL=false}'
    username: '${DB_USERNAME:root}'
    password: '${DB_PASSWORD:}'
  jpa:
    hibernate:
      ddl-auto: '${DB_DDL_AUTO:update}'
    open-in-view: true
  thymeleaf:
    prefix: classpath:/templates/
    check-template-location: true
    suffix: .html
    encoding: UTF-8
    mode: HTML
    cache: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 105MB
server:
  port: 8082
  error:
    include-message: never
app:
  storage: '${APP_STORAGE:./data/uploads}'

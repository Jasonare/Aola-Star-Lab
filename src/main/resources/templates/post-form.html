<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('发布内容')}"></head>
    <body>
        <nav th:replace="~{layout :: nav}"></nav>
        <main>
            <div class="page-heading"><div><p class="eyebrow">创作台</p><h1 th:text="${post.kind.name() == 'BLOG' ? '发布文章' : '发布视频'}"></h1><p class="muted" th:text="${post.kind.name() == 'BLOG' ? '上传最多9张图片，发布前可预览。' : '上传一个 MP4 视频，提交后进入审核。建议使用 H.264 视频和 AAC 音频编码；其他编码可能无法在浏览器播放。'}"></p></div></div>
            <section class="editor-panel">
                <form th:action="@{/posts/save(_csrf=${_csrf.token})}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="id" th:value="${post.id}">                    <input type="hidden" name="kind" th:value="${post.kind}">
                    <input th:if="${post.kind.name() == 'BLOG'}" type="hidden" name="imageSelectionProvided" value="true">
                    <input th:if="${post.kind.name() == 'BLOG'}" type="hidden" name="imageSelectionProvided" value="true">
                    <label>标题<input name="title" maxlength="150" required th:value="${post.title}" placeholder="给内容起一个清楚的标题"></label>
                    <label>文案<textarea name="body" maxlength="10000" th:text="${post.body}" placeholder="写下你的内容"></textarea></label>
                    <label>可见范围<select name="visibility"><option th:each="v : ${T(com.aola.lab.Model.Visibility).values()}" th:value="${v}" th:text="${v.name() == 'PUBLIC' ? '公开' : (v.name() == 'FRIENDS' ? '仅好友' : '仅自己')}" th:selected="${post.visibility == v}"></option></select></label>
                    <fieldset><legend>标签</legend><div class="tag-picker"><label th:each="tag : ${tags}"><input type="checkbox" name="tagIds" th:value="${tag.id}" th:checked="${selectedTagIds.contains(tag.id)}"><span th:text="${tag.name}"></span></label></div></fieldset>
                    <label for="media-files" th:text="${post.kind.name() == 'BLOG' ? '文章图片（PNG、JPEG、WebP，最多9张）' : '视频文件（MP4）'}"></label>
                    <input id="media-files" type="file" name="files" th:multiple="${post.kind.name() == 'BLOG'}" th:accept="${post.kind.name() == 'BLOG' ? 'image/png,image/jpeg,image/webp' : 'video/mp4'}">
                    <div class="existing-media" th:if="${post.kind.name() == 'BLOG' and !#lists.isEmpty(post.imageKeys)}">
                        <p class="field-label">已保存图片</p>
                        <div id="saved-image-preview" class="image-preview image-grid">
                            <figure class="image-tile" th:each="imageKey, stat : ${post.imageKeys}" th:attr="data-image-tile=${stat.index}">
                                <a class="image-lightbox-link" th:href="@{/posts/{id}/images/{index}(id=${post.id},index=${stat.index})}" target="_blank" rel="noopener">
                                    <img th:src="@{/posts/{id}/images/{index}(id=${post.id},index=${stat.index})}" alt="已保存的文章图片">
                                </a>
                                <input type="hidden" name="retainedImageIndexes" th:value="${stat.index}">
                                <button class="image-remove-button" type="button" aria-label="删除这张图片" title="删除这张图片"><i class="fa fa-times" aria-hidden="true"></i></button>
                            </figure>
                        </div>
                    </div>
                    <div class="existing-media" th:if="${post.kind.name() == 'VIDEO' and post.fileKey != null}">
                        <p class="field-label">当前视频</p>
                        <div class="video-frame editor-video-frame">
                            <video controls preload="metadata" th:src="@{/posts/{id}/file(id=${post.id})}" aria-label="当前已上传视频"></video>
                        </div>
                    </div>
                    <div id="image-preview" class="image-preview" aria-live="polite"></div>
                    <div id="upload-progress" class="upload-progress" th:if="${post.kind.name() == 'VIDEO'}" hidden aria-live="polite">
                        <div class="upload-progress-heading"><span id="upload-progress-label">准备上传</span><span id="upload-progress-value">0%</span></div>
                        <progress id="upload-progress-bar" max="100" value="0">0%</progress>
                    </div>
                    <p id="upload-error" class="error" role="alert" hidden></p>
                    <button id="submit-post" type="submit" th:text="${post.id == null ? '提交发布' : '保存并重新提交'}"></button>
                </form>
            </section>
        </main>
        <script>
            const mediaInput = document.getElementById('media-files');
            const preview = document.getElementById('image-preview');
            const savedPreview = document.getElementById('saved-image-preview');
            const editorForm = mediaInput?.closest('form');
            const uploadProgress = document.getElementById('upload-progress');
            const progressBar = document.getElementById('upload-progress-bar');
            const progressValue = document.getElementById('upload-progress-value');
            const progressLabel = document.getElementById('upload-progress-label');
            const uploadError = document.getElementById('upload-error');
            const submitButton = document.getElementById('submit-post');
            const renderImagePreview = () => {
                preview.innerHTML = '';
                const files = Array.from(mediaInput?.files || []);
                const retainedTiles = savedPreview?.querySelectorAll('.image-tile') || [];
                const retainedCount = retainedTiles.length;
                const totalCount = files.length + retainedCount;
                if (totalCount > 9 && mediaInput.multiple) {
                    preview.innerHTML = '<p class="error">文章最多保留或上传9张图片。</p>';
                    submitButton.disabled = true;
                    return;
                }
                submitButton.disabled = false;
                if (mediaInput.multiple) {
                    mediaInput.setAttribute('aria-label', `添加文章图片（当前 ${totalCount} 张，最多9张）`);
                    const countLabel = document.querySelector('label[for="media-files"]');
                    if (countLabel) countLabel.textContent = `文章图片（PNG、JPEG、WebP，${totalCount}/9）`;
                }
                if (mediaInput.accept === 'video/mp4') {
                    const file = files[0];
                    if (!file) return;
                    const video = document.createElement('video');
                    video.controls = true;
                    video.preload = 'metadata';
                    video.src = URL.createObjectURL(file);
                    video.setAttribute('aria-label', file.name);
                    preview.classList.add('video-file-preview');
                    preview.appendChild(video);
                    return;
                }
                preview.classList.remove('video-file-preview');
                files.forEach((file, index) => {
                    if (!file.type.startsWith('image/')) return;
                    const tile = document.createElement('figure');
                    tile.className = 'image-tile';
                    const link = document.createElement('a');
                    link.className = 'image-lightbox-link';
                    link.href = URL.createObjectURL(file);
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.setAttribute('aria-label', `查看原图：${file.name}`);
                    const img = document.createElement('img');
                    img.alt = file.name;
                    img.src = link.href;
                    link.appendChild(img);
                    const remove = document.createElement('button');
                    remove.className = 'image-remove-button';
                    remove.type = 'button';
                    remove.title = '移除这张图片';
                    remove.setAttribute('aria-label', `移除图片：${file.name}`);
                    remove.innerHTML = '<i class="fa fa-times" aria-hidden="true"></i>';
                    remove.addEventListener('click', () => {
                        const transfer = new DataTransfer();
                        Array.from(mediaInput.files).forEach((current, currentIndex) => {
                            if (currentIndex !== index) transfer.items.add(current);
                        });
                        mediaInput.files = transfer.files;
                        renderImagePreview();
                    });
                    tile.append(link, remove);
                    preview.appendChild(tile);
                });
            };
            mediaInput?.addEventListener('change', renderImagePreview);
            const imageTileClick = (event) => {
                const removeButton = event.target.closest('.image-remove-button');
                if (!removeButton || !savedPreview?.contains(removeButton)) return;
                const tile = removeButton.closest('.image-tile');
                tile.remove();
                renderImagePreview();
            };
            savedPreview?.addEventListener('click', imageTileClick);
            if (mediaInput?.accept === 'video/mp4' && editorForm && uploadProgress) {
                editorForm.addEventListener('submit', (event) => {
                    if (!mediaInput.files?.length) return;
                    event.preventDefault();
                    const formData = new FormData(editorForm);
                    uploadError.hidden = true;
                    uploadProgress.hidden = false;
                    mediaInput.disabled = true;
                    submitButton.disabled = true;
                    submitButton.textContent = '正在上传…';
                    progressLabel.textContent = '正在上传视频';

                    const request = new XMLHttpRequest();
                    request.open('POST', editorForm.action);
                    request.upload.addEventListener('progress', (progressEvent) => {
                        if (!progressEvent.lengthComputable) return;
                        const percent = Math.min(100, Math.round(progressEvent.loaded * 100 / progressEvent.total));
                        progressBar.value = percent;
                        progressValue.textContent = percent + '%';
                    });
                    request.addEventListener('load', () => {
                        if (request.status >= 200 && request.status < 400) {
                            progressBar.value = 100;
                            progressValue.textContent = '100%';
                            progressLabel.textContent = '上传完成，正在打开结果';
                            window.location.assign(request.responseURL || editorForm.action);
                            return;
                        }
                        const responseText = (request.responseText || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                        const responseSummary = responseText.slice(0, 200);
                        uploadError.textContent = `上传失败（HTTP ${request.status}）${responseSummary ? '：' + responseSummary : '，服务器未返回错误详情。'}`;
                        uploadError.hidden = false;
                        progressLabel.textContent = '上传失败';
                        mediaInput.disabled = false;
                        submitButton.disabled = false;
                        submitButton.textContent = '重新上传';
                    });
                    request.addEventListener('error', () => {
                        uploadError.textContent = '网络连接中断，视频未能上传。请重试。';
                        uploadError.hidden = false;
                        progressLabel.textContent = '上传失败';
                        mediaInput.disabled = false;
                        submitButton.disabled = false;
                        submitButton.textContent = '重新上传';
                    });
                    request.addEventListener('abort', () => {
                        progressLabel.textContent = '上传已取消';
                        mediaInput.disabled = false;
                        submitButton.disabled = false;
                        submitButton.textContent = '重新上传';
                    });
                    request.send(formData);
                });
            }
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('注册')}">
    </head>
    <body class="auth-page">
        <main>
            <h1>
                注册个人账号
            </h1>
            <form th:action="@{/register}" method="post">
                <label>用户名（3–40位字母、数字或下划线）<input name="username" pattern="[A-Za-z0-9_]{3,40}" required></label>
                <label>密码（8–72位）<input type="password" name="password" minlength="8" maxlength="72" required></label>
                <button>注册</button>
            </form>
            <a th:href="@{/login}">返回登录</a>
        </main>
    </body>
</html>

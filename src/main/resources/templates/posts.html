<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('博客与视频')}"></head>
    <body>
        <nav th:replace="~{layout :: nav}"></nav>
        <main>
            <div class="page-heading"><div><p class="eyebrow">内容库</p><h1 th:text="${sectionTitle}">内容库</h1><p class="muted">发现实验记录、攻略和视频内容。</p></div><div class="actions"><a class="btn" th:href="@{/posts/new(kind=${selectedKind != null ? selectedKind : 'BLOG'})}" th:text="${selectedKind != null and selectedKind.name() == 'VIDEO' ? '发布视频' : '发布文章'}">发布文章</a></div></div>
            <form class="filter-bar" th:action="@{/posts}" method="get">
                <label>搜索<input name="q" th:value="${query}" placeholder="输入标题或关键词"></label>
                <label>标签<select name="tag"><option value="">全部标签</option><option th:each="tag : ${tags}" th:value="${tag.id}" th:text="${tag.name}" th:selected="${selectedTag == tag.id}"></option></select></label>
                <input type="hidden" name="kind" th:if="${selectedKind != null}" th:value="${selectedKind.name()}">
                <label>起始时间<input type="date" name="from" th:value="${fromDate}" th:attr="max=${untilDate}"></label>
                <label>终止时间<input type="date" name="until" th:value="${untilDate}" th:attr="min=${fromDate}"></label>
                <label>排序方式<select name="sort"><option value="time" th:selected="${selectedSort == 'time'}">更新时间倒序</option><option value="likes" th:selected="${selectedSort == 'likes'}">点赞数倒序</option><option value="views" th:selected="${selectedSort == 'views'}">浏览量倒序</option></select></label>
                <button><i class="fa fa-search" aria-hidden="true"></i> 搜索内容</button>
            </form>
            <section class="list-panel">
                <div class="section-header"><h2>最新内容</h2><span class="muted" th:text="${#lists.size(posts)} + ' 条结果'"></span></div>
                <div class="video-grid" th:if="${selectedKind != null and selectedKind.name() == 'VIDEO'}">
                    <article class="video-card" th:each="p : ${posts}">
                        <a class="video-frame-link" th:href="@{/posts/{id}(id=${p.id})}" th:if="${p.fileKey == null}">
                            <div class="video-frame video-frame-empty"><span>暂无视频文件</span></div>
                        </a>
                        <div class="video-frame" th:if="${p.fileKey != null}">
                            <video controls preload="metadata" th:src="@{/posts/{id}/file(id=${p.id})}" th:aria-label="${p.title}"></video>
                        </div>
                        <div class="video-card-copy">
                            <a class="post-title" th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}"></a>
                            <p class="post-list-meta"><span th:text="${p.author.username}"></span><span class="dot-sep">·</span><span th:text="${postDates[p.id]}"></span><span class="dot-sep">·</span><span th:text="${p.viewCount} + ' 浏览'"></span><span class="dot-sep">·</span><span th:text="${likeCounts[p.id]} + ' 点赞'"></span><span class="dot-sep">·</span><span th:text="${commentCounts[p.id]} + ' 评论'"></span></p>
                            <div class="tag-line"><span class="tag" th:each="tag : ${p.tags}" th:text="${tag.name}"></span></div>
                        </div>
                    </article>
                </div>
                <div class="post-list" th:if="${selectedKind == null or selectedKind.name() != 'VIDEO'}">
                    <article class="post-row" th:each="p : ${posts}">
                        <div class="post-kind" th:text="${p.kind.name() == 'BLOG' ? '文' : '影'}"></div>
                        <div class="post-copy">
                            <a class="post-title" th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}"></a>
                            <p class="post-list-meta"><span th:text="${p.author.username}"></span><span class="dot-sep">·</span><span th:text="${postDates[p.id]}"></span><span class="dot-sep">·</span><span th:text="${p.viewCount} + ' 浏览'"></span><span class="dot-sep">·</span><span th:text="${likeCounts[p.id]} + ' 点赞'"></span><span class="dot-sep">·</span><span th:text="${commentCounts[p.id]} + ' 评论'"></span></p>
                            <p class="article-preview" th:if="${p.kind.name() == 'BLOG'}" th:text="${#strings.length(p.body == null ? '' : p.body) > 20 ? #strings.substring(p.body, 0, 20) + '…' : (p.body == null ? '' : p.body)}"></p>
                            <a class="read-more" th:if="${p.kind.name() == 'BLOG'}" th:href="@{/posts/{id}(id=${p.id})}">阅读全文 <i class="fa fa-angle-right"></i></a>
                            <div class="tag-line"><span class="tag" th:each="tag : ${p.tags}" th:text="${tag.name}"></span></div>
                        </div>
                    </article>
                </div>
                <div class="empty" th:if="${#lists.isEmpty(posts)}">没有符合条件的内容，换个关键词试试。</div>
            </section>
        </main>
    </body>
</html>

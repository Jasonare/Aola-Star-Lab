<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{layout :: head('资源目录')}"></head>
    <body>
        <nav th:replace="~{layout :: nav}"></nav>
        <main>
            <div class="page-heading"><div><p class="eyebrow">资源中心</p><h1>资源中心</h1><p class="muted">双击目录进入子目录，文件通过授权接口下载。</p></div></div>
            <div class="resource-breadcrumb"><a th:href="@{/resources}"><i class="fa fa-home"></i> 根目录</a><span th:if="${activeFolder != null}"><i class="fa fa-angle-right"></i> <span th:text="${activeFolder.name}"></span></span></div>
            <section class="resource-section resource-browser">
                <div class="section-header"><h2><i class="fa fa-folder-open-o folder-icon"></i> <span th:text="${activeFolder == null ? '根目录' : activeFolder.name}"></span></h2><a class="btn btn-secondary btn-sm" th:if="${parentFolder != null}" th:href="@{/resources(folderId=${parentFolder.id})}"><i class="fa fa-level-up"></i> 返回上级</a></div>
                <div class="resource-list">
                    <div class="resource-row resource-folder-row" th:each="folder : ${folders}" th:attr="data-folder-url=@{/resources(folderId=${folder.id})}"><i class="fa fa-folder-o folder-icon"></i><span class="resource-name" th:text="${folder.name}"></span><span class="muted" th:if="${#lists.isEmpty(folder.children)}">下面没有目录啦~</span><a class="icon-action folder-enter-button" th:if="${!#lists.isEmpty(folder.children)}" th:href="@{/resources(folderId=${folder.id})}" th:attr="aria-label=${'打开目录 ' + folder.name}" title="打开目录"><i class="fa fa-chevron-right" aria-hidden="true"></i></a></div>
                    <div class="resource-row" th:each="item : ${items}"><span class="resource-name"><i class="fa fa-file-o"></i> <span th:text="${item.name}"></span></span><a class="icon-action resource-download-button" th:href="@{/resources/{id}/file(id=${item.id})}" title="下载文件" aria-label="下载文件"><i class="fa fa-download" aria-hidden="true"></i></a><span class="resource-state" th:if="${currentUser.admin}" th:text="${item.visible ? '可见' : '隐藏'}"></span><form th:if="${currentUser.admin}" th:action="@{/admin/resources/{id}/visibility(id=${item.id})}" method="post"><button class="btn-sm btn-secondary" th:text="${item.visible ? '隐藏' : '设为可见'}"></button></form></div>
                    <div class="empty" th:if="${#lists.isEmpty(folders) and #lists.isEmpty(items)}">当前目录为空。</div>
                </div>
            </section>
            <section class="upload-panel" th:if="${currentUser.admin}"><div class="section-header"><h2>上传资源</h2><span class="badge">管理员</span></div><p class="muted">支持 PNG、JPEG、WebP、MP4、PDF、ZIP、EXE 和 APK，最大 100MB。</p><form th:action="@{/admin/resources}" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>目录<select name="folderId" required><option th:each="folder : ${foldersForUpload}" th:value="${folder.id}" th:text="${folder.parent == null ? folder.name : folder.parent.name + ' / ' + folder.name}" th:selected="${activeFolder != null and folder.id == activeFolder.id}"></option></select></label><input type="file" name="file" required><button><i class="fa fa-upload"></i> 上传资源</button></form></section>
        </main>
        <script>
            document.querySelectorAll('.resource-folder-row').forEach((row) => {
                row.addEventListener('dblclick', (event) => {
                    if (event.target.closest('a')) return;
                    window.location.href = row.dataset.folderUrl;
                });
            });
        </script>
    </body>
</html>

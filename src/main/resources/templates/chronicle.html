<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('奥拉星怀旧编年史')}"></head><body>
<header th:replace="~{layout :: nav}"></header>
<link rel="stylesheet" th:href="@{/chronicle/style.css}">
<div class="chronicle-page" th:attr="data-asset-base=@{/chronicle/}">
<div class="scenery" aria-hidden="true"><div class="backdrop"></div><div class="backdrop"></div><div class="veil"></div><div class="orbit"></div><div id="dust"></div></div>
<main id="chronicle"><header><h1><img th:src="@{/chronicle/assets/title-source.png}" alt="奥拉星怀旧编年史"></h1><p>✧　拖动奥拉之辉，穿梭星际回忆　✧</p><button id="open-editor" class="gold-button">✎ 编辑编年史</button></header>
<section class="timeline" aria-label="编年史时间轴"><div id="viewport" tabindex="0" aria-label="横向滚动时间轴"><div id="track"><div id="rail"></div><div id="entries"></div><button id="slider" role="slider" aria-label="奥拉之辉" aria-valuemin="1"><img th:src="@{/chronicle/assets/emblem.png}" alt="" draggable="false"></button></div></div><p id="empty" hidden>星图还是空的。在编辑界面添加第一个节点。</p></section>
<footer><button id="prev" aria-label="上一个节点">‹</button><span id="position" aria-live="polite"></span><button id="next" aria-label="下一个节点">›</button></footer></main>
<main id="editor" hidden><div class="editor-wrap"><div class="editor-head"><h2>编辑编年史</h2><button id="cancel" class="gold-button">返回时间轴</button></div><p>节点按下方顺序展示。保存后，修改会保存在当前浏览器。</p><form id="form"><div id="fields"></div><div class="editor-actions"><button type="button" id="add" class="gold-button">＋ 添加节点</button><button class="gold-button primary">保存并返回</button></div><p id="error" role="alert"></p></form></div></main>
<template id="node-form"><fieldset><legend></legend><div class="form-grid"><label>年份<input name="year" required maxlength="16"></label><label>版本标题<input name="title" required maxlength="40"></label><label>代表亚比<input name="yabi" maxlength="65"></label><label>背景图片地址<input name="background" placeholder="https://… 或 assets/…"></label><label class="wide">简介<textarea name="description" rows="3" maxlength="240"></textarea></label></div><div class="row-actions"><button type="button" data-action="up">上移</button><button type="button" data-action="down">下移</button><button type="button" data-action="remove">删除</button></div></fieldset></template>
</div><script th:src="@{/chronicle/nodes.js}"></script><script th:src="@{/chronicle/app.js}"></script></body></html>
